name: CodeQL

# Static security analysis for the C# backend and the TypeScript frontend. Runs on
# PRs and main, plus a weekly scheduled scan to catch newly-published query rules
# against unchanged code. Findings land in the repo's Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * 1" # Mondays 02:30 UTC

permissions:
  contents: read
  security-events: write # upload analysis results to code scanning

# A newer push to the same PR supersedes the in-flight scan; without this, two full
# two-language analyses run and the stale one still uploads to the Security tab.
# Cancelling is safe here, CodeQL publishes nothing a cancel could leave half-written.
# The scheduled run is keyed by ref too, so it never cancels a PR's scan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Buildless analysis for both: C# `build-mode: none` skips compiling (no .NET
        # SDK needed on the runner), JS/TS never builds. Keeps the scan independent of
        # the build jobs in ci.yml.
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
