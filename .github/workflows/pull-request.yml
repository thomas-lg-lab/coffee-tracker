# The organisation's PR conventions: Conventional Commit title (required check `conventions / title`) and the
# label it implies. Shared workflow of thomas-lg-lab/.github.
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: write
      security-events: write # zizmor's SARIF upload
    uses: thomas-lg-lab/.github/.github/workflows/pr-conventions.yml@35e66e4e8cf3abc1ca49e81e43543c077b64ff64 # v2.5.0
