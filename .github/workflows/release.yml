name: Release

# Builds and pushes the image to GHCR. Merging is not releasing: a branch build is gated
# on CI and runs via workflow_run when the CI workflow succeeds on `main`
# (=> :edge + :sha-<short>). Only a version tag v*
# moves :latest (=> :latest + semver tags). A tag only publishes if its commit is on main
# and CI passed on it (checked below, not assumed), and the Trivy gate scans the image
# again before it's pushed.
#
# A tag pushed by a person triggers the `push` event. A release published by
# draft-release.yml creates its tag with GITHUB_TOKEN, which never starts another
# workflow, so that job dispatches this one on the tag instead (workflow_dispatch is the
# one event GITHUB_TOKEN may trigger).
#
# `edge` is the channel to try a change on real hardware before a release: nothing in
# production tracks it. A change not merged yet is tried from its PR's CI build instead.
# (The former `beta` branch and channel were dropped on 8 November 2026, trunk-based.)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # mint the OIDC token for the build-provenance attestation
  attestations: write # record the attestation against the pushed image
  actions: read # a tag build checks that CI passed on the tagged commit

# Serialize publishes per channel so rapid pushes can't race on a moving tag. Keyed on
# the triggering branch, not github.ref: on a workflow_run event that is the default
# branch whatever built. No
# cancel-in-progress: killing a run mid-push could leave a tag without its attestation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/thomas-lg-lab/coffee-tracker

jobs:
  image:
    runs-on: ubuntu-latest
    # Branches: only publish when the gating CI run succeeded. On main, additionally
    # require that its commit is still the tip (a superseding push gets its own CI run
    # and release, so a stale run publishing an old sha would only churn :latest).
    # github.sha is the default branch's head on a workflow_run event, which is exactly
    # what that comparison needs. Tags: publish.
    #
    # The event/repository pair is load-bearing, not belt-and-braces: ci.yml runs on
    # pull_request, so it runs for fork PRs too, and `head_branch` is then the branch name
    # *inside the fork*, anyone naming theirs `main` would otherwise have their unmerged
    # head published. `event == 'push'` is the strong half.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.head_sha == github.sha)
      || startsWith(github.ref, 'refs/tags/v')
    steps:
      # On a workflow_run event GITHUB_SHA and GITHUB_REF point at the DEFAULT branch,
      # not at the commit whose CI just passed. Checking out the default would build
      # whatever main's tip is now, so take the head sha explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # A tag build needs main's history for the ancestry check below. The values are
          # strings: a bare 0 is falsy, so `cond && 0 || 1` always gave a shallow clone.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
      # release-drafter tags main's HEAD at publish time, whether or not CI has finished
      # there, and anyone with write access can push a v* tag on any commit. Nothing
      # upstream guarantees a release is a commit main has built green, so check it here,
      # before anything is pushed.
      - name: Check the tagged commit is on main and passed CI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($SHA) is not on main; refusing to publish it as :latest."
            exit 1
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA"             --event push --branch main --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::No successful CI run on main for $SHA. Wait for CI, then re-run this workflow on $GITHUB_REF_NAME."
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/metadata-action derives type=sha from the git context, which on a
      # workflow_run event is the DEFAULT branch, so it cannot be trusted to describe
      # what was actually checked out. Resolve the commit once here and build the tag
      # from it.
      - id: ctx
        name: Resolve the commit being built
        run: |
          SHA='${{ github.event.workflow_run.head_sha || github.sha }}'
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # The channel is read from the triggering run's branch, never from
          # is_default_branch: on a workflow_run event that flag describes the default
          # branch regardless of what actually built.
          #
          # The sha tag is raw, not type=sha: type=sha has no `value` attribute, so
          # passing one is silently ignored and the tag is computed from the git
          # context, which can name a different commit than the one checked out. priority
          # keeps it below the channel tags so outputs.version stays the channel, which
          # is what the Trivy step scans. A tag build skips it: main's edge build already
          # published that sha tag, and re-pushing it from a second, non-reproducible
          # build would move a tag the README calls immutable.
          #
          # No explicit `latest`: the default flavor (latest=auto) adds it for a semver
          # tag and skips pre-releases, which a raw `latest` on every v* ref did not.
          tags: |
            type=raw,value=edge,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=sha-${{ steps.ctx.outputs.short_sha }},priority=100,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
          # Same root cause as the sha tag: metadata-action derives the revision label
          # from the git context, which on a workflow_run event is the default branch.
          # An image that says it was built from a commit it does not contain defeats
          # the point of the label, so state it from the commit actually checked out.
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
      # Build first WITHOUT pushing so Trivy can gate on the exact image; the push
      # step below reuses the warm buildx cache, so it doesn't rebuild.
      #
      # amd64 only here because `load` can only take one platform. Both images install
      # the same packages from the same base, so scanning one covers the CVEs of the
      # manifest the push step publishes.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Block the release only on a fixable CRITICAL CVE (vuln scanner only). HIGHs are
      # reported on PRs (ci.yml) but don't block: base-image HIGHs churn with the vuln DB
      # and are outside our control, so they shouldn't wedge a release.
      - name: Scan release image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
      # Publishes a manifest list, so `docker pull` resolves the right image on an
      # x86 NAS and on an ARM one (Raspberry Pi, ARM-based NAS) alike.
      - id: build
        name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Signed proof of where/how the image was built, verifiable with
      # `gh attestation verify oci://ghcr.io/thomas-lg-lab/coffee-tracker:<tag>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
