name: CI

# Runs on every PR, on pushes to main and on release tags: backend, frontend and e2e, then the
# image through the organisation's shared workflow (thomas-lg-lab/.github), which builds and
# gates it on PRs, publishes :edge and :sha-<short> from main, and :X.Y.Z / :latest from a
# release tag. Nothing is published that did not pass the checks of the same run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  # release-drafter.yml dispatches this workflow on the tag a published release creates.
  workflow_dispatch:

# Least privilege: the check jobs only read the repo; the image job asks for its own.
permissions:
  contents: read

# A newer push to a PR cancels its run. main and tags never cancel: their run publishes, and
# killing it mid-push could leave a tag without its attestation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Cache the global NuGet package store, keyed on the committed lock files so the
      # key changes exactly when a resolved dependency changes.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # Native OCR deps so the Tesseract-backed tests can run on the runner.
      # Mirror the dev/prod package set; TESSDATA_PREFIX is the PARENT of tessdata.
      # Both engines, because the benchmark scores whichever one ships as the default
      # and a number measured against an engine nobody runs is worth nothing.
      - name: Install the OCR engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng libtesseract-dev libleptonica-dev \
            libgl1 libglib2.0-0
          # The same pinned file the image installs, so CI scores the engine that ships.
          pip install --no-cache-dir -r deploy/rapidocr/requirements.txt
          # Both go, then only the headless wheel comes back: the two share the `cv2`
          # directory, so removing one takes it away and pip skips reinstalling the
          # other as already present. Re-running the whole file would also let pip
          # satisfy rapidocr's dependency and bring the GUI build back.
          pip uninstall -y opencv-python opencv-python-headless
          pip install --no-cache-dir "$(grep '^opencv-python-headless' deploy/rapidocr/requirements.txt)"
          # Fetch the models now, so the benchmark's first fixture is not also a download.
          python3 -c "from rapidocr import RapidOCR; RapidOCR()"
      # --locked-mode fails the restore if packages.lock.json is out of date, so a
      # dependency bump can't sneak in without an updated, reviewed lock file.
      - run: dotnet restore CoffeeTracker.sln --locked-mode
      - run: dotnet build CoffeeTracker.sln --no-restore --configuration Release
      - name: Test
        env:
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5
        run: dotnet test CoffeeTracker.sln --no-build --configuration Release --verbosity normal
      # The OCR benchmark runs as part of the suite above (this job already installs
      # Tesseract) and writes its scorecard beside the test assembly. Surfacing it here
      # is what makes a score change reviewable: the number moves in the run summary of
      # the PR that moved it, instead of inside collapsed log output nobody expands.
      # It runs even after a failed test step, because a run that fell under the floor
      # is exactly the one worth reading.
      - name: OCR benchmark scorecard
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          cards=(backend/CoffeeTracker.Tests/bin/Release/net10.0/ocr-benchmark-*.md)
          if [ ${#cards[@]} -eq 0 ]; then
            echo "OCR benchmark did not run (no scorecard produced)." >> "$GITHUB_STEP_SUMMARY"
          else
            # One per engine. Both are published because every parser constant is shared
            # between them, so a change that helps one can cost the other.
            for card in "${cards[@]}"; do
              cat "$card" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  frontend:
    runs-on: ubuntu-latest
    # This job builds + unit-tests only; @playwright/test's browser download is the
    # e2e job's concern, so skip it here to keep npm ci fast.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      # Before lint, because a drift in formatting is the cheapest thing to catch and
      # the noisiest thing to let land. `npm run format` fixes every hit locally.
      - name: Format check (prettier)
        working-directory: frontend
        run: npm run format:check
      - working-directory: frontend
        run: npm run lint --if-present
      # The production build is the comprehensive compile gate: it type-checks and
      # bundles the app + every library (via the source path aliases).
      - name: Build (production)
        working-directory: frontend
        run: npx ng build app --configuration production
      # Unit tests via the vitest builder (NOT Karma, so no --browsers). `npm test`
      # runs the workspace-wide `tests` project, which covers every package's specs in
      # one build, so a laptop runs exactly what CI runs. This used to be seven
      # hand-listed commands here, while a bare `ng test` locally covered only the
      # default project and hid 16 of the 19 spec files.
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Start the API on :5000 in the background against a database that does not exist
      # yet, so the instance opens registration for its first account. The e2e global
      # setup claims it (becoming admin) and reopens registration for the rest of the
      # suite. Development also disables OCR (no Tesseract needed). The Angular dev
      # server that Playwright starts proxies /api here.
      - name: Start backend API
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet run --project backend/CoffeeTracker.Api --urls http://localhost:5000 &
      # Poll the liveness endpoint the container's HEALTHCHECK also uses. It is mapped
      # anonymously (outside the global auth fallback policy), so no token is needed.
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "API ready"; exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"; exit 1
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      # Drift guard: re-derive the OpenAPI doc + typed client from the running backend
      # and fail if they differ from what's committed, so a backend contract change that
      # wasn't regenerated can't ship a stale frontend client that only breaks at runtime.
      - name: Check generated API client is up to date
        working-directory: frontend
        run: |
          curl -fsS http://localhost:5000/openapi/v1.json -o openapi.json
          npm run gen:api
          git diff --exit-code -- openapi.json packages/data/src/lib/models/api-types.ts \
            || { echo "::error::OpenAPI client is stale, run 'npm run gen:api' and commit the result."; exit 1; }
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright starts the Angular dev server (ng serve on :4200) via webServer.
      - name: Run Playwright e2e
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # The image, once the three suites passed. verify-arm64: the image ships for arm64 too, so a
  # PR that breaks that build has to fail here rather than at release; the shared workflow
  # builds it on a native arm64 runner (under QEMU it took 366 seconds against 116 for amd64,
  # emulating a pip install of onnxruntime and numpy). Not scanned: both images install the
  # same packages from the same base, so scanning amd64 covers the CVEs of both.
  image:
    needs: [backend, frontend, e2e]
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
      attestations: write
    uses: thomas-lg-lab/.github/.github/workflows/container-image.yml@21ff202fae4e0f07d7f18b710022abc2d5004f96 # v2.0.0
    with:
      verify-arm64: true
